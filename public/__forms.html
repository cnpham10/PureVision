<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Estimate request</title>
  </head>
  <body>
    <!-- Detected at deploy time. The contact form posts leads, including photos, here. -->
    <form
      name="estimate"
      method="POST"
      action="/__forms.html"
      enctype="multipart/form-data"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="estimate" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="description"></textarea>
      <input type="file" name="project-image-1" />
      <input type="file" name="project-image-2" />
      <input type="file" name="project-image-3" />
      <input type="file" name="project-image-4" />
    </form>
  </body>
</html>
